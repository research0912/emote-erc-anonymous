experiment:
  name: meld_roberta_large_text_only_a100_seed44
  seed: 44
  output_dir: outputs/meld_roberta_large_text_only_a100_seed44

dataset:
  name: meld
  train_path: data/meld/MELD_train.txt
  val_path: data/meld/MELD_dev.txt
  test_path: data/meld/MELD_test.txt
  context_window: 0
  speaker_history_window: 0
  use_gold_previous_emotion: false
  max_length: 256
  turn_max_length: 96
  labels: [anger, disgust, fear, joy, neutral, sadness, surprise]

data_loader:
  cache_tokenized: true
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  base_model: roberta-large
  gradient_checkpointing: true
  pooling_strategy: cls_last4_mean
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  lora_target_modules: [query, value]
  main_input_include_context: false
  use_bilstm: false
  dialogue_flow_source: none
  main_input_include_context_when_turn_level: false
  use_gnn: false
  use_speaker_state: false
  use_emotion_shift: false
  use_cross_attention: false
  use_dynamic_fusion: false
  use_attention_fusion: false
  use_contrastive: true
  contrastive_proj_dim: 256
  contrastive_temperature: 0.1
  fusion_hidden_size: 512
  dropout: 0.2

training:
  epochs: 11
  batch_size: 8
  grad_accum_steps: 2
  learning_rate: 8.0e-6
  head_learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.08
  max_grad_norm: 1.0
  loss_type: refined_ce
  refinement_alpha: 0.18
  class_weighted_loss: false
  contrastive_weight: 0.01
  fp16: true
  save_every_steps: 1000
  eval_every_steps: 1000
  early_stopping_patience: 4
  monitor_metric: weighted_f1
